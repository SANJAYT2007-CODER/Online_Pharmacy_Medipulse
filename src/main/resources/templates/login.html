<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediPulse - Access Platform</title>
    <!-- Outfit & Inter Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --success: #10b981;
            --danger: #ef4444;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
            --radius-md: 16px;
            --radius-sm: 8px;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-inset: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            padding: 2.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 8px 16px rgba(2, 132, 199, 0.2);
        }

        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .brand-name span {
            color: var(--primary);
        }

        /* Tabs setup */
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 30px;
            margin-bottom: 2rem;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 0.75rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* Form styling */
        .form-panel {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .form-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-light);
            font-size: 0.95rem;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 20px -6px rgba(2, 132, 199, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        /* Demo credentials section */
        .demo-section {
            margin-top: 2rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .demo-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            text-align: center;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
        }

        .demo-chip {
            background: var(--bg-light);
            border: 1px dashed var(--text-muted);
            border-radius: var(--radius-sm);
            padding: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .demo-chip:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .notification {
            display: none;
            background: var(--danger);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-icon"><i class="fa-solid fa-prescription-bottle-medical"></i></div>
            <div class="brand-name">Medi<span>Pulse</span></div>
        </div>

        <!-- Notification Banner -->
        <div class="notification" id="notifyBanner"></div>

        <!-- Auth Switch Tabs -->
        <div class="tabs">
            <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn" id="registerTabBtn" onclick="switchTab('register')">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <div class="form-panel active" id="loginPanel">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-right-to-bracket"></i> Enter Platform
                </button>
            </form>

            <!-- Quick Demo Access credentials -->
            <div class="demo-section">
                <div class="demo-title">Quick Demo Login</div>
                <div class="demo-grid">
                    <div class="demo-chip" onclick="quickFill('customer@pharmacy.com', 'customer123')">
                        <i class="fa-solid fa-user"></i> Customer
                    </div>
                    <div class="demo-chip" onclick="quickFill('pharmacist@pharmacy.com', 'pharmacy123')">
                        <i class="fa-solid fa-user-doctor"></i> Pharma
                    </div>
                    <div class="demo-chip" onclick="quickFill('admin@pharmacy.com', 'admin123')">
                        <i class="fa-solid fa-shield-halved"></i> Admin
                    </div>
                </div>
            </div>
        </div>

        <!-- REGISTER FORM -->
        <div class="form-panel" id="registerPanel">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="regName" class="form-control" placeholder="Alex Johnson" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="regEmail" class="form-control" placeholder="alex@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPassword" class="form-control" placeholder="Min. 6 characters" minlength="6" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Mobile Number</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="regPhone" class="form-control" placeholder="+1-800-555-0199">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Default Account Role</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-users-gear" style="z-index: 10;"></i>
                        <select id="regRole" class="form-control" required style="padding-left: 2.75rem;">
                            <option value="CUSTOMER">Customer / Patient</option>
                            <option value="PHARMACIST">Certified Pharmacist</option>
                            <option value="ADMIN">System Administrator</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>
            </form>
        </div>

    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-panel').forEach(panel => panel.classList.remove('active'));

            if (tab === 'login') {
                document.getElementById('loginTabBtn').classList.add('active');
                document.getElementById('loginPanel').classList.add('active');
            } else {
                document.getElementById('registerTabBtn').classList.add('active');
                document.getElementById('registerPanel').classList.add('active');
            }
        }

        function quickFill(email, pwd) {
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = pwd;
            // Instantly submit for developer convenience
            document.querySelector('#loginPanel form').requestSubmit();
        }

        function showError(msg) {
            const banner = document.getElementById('notifyBanner');
            banner.innerText = msg;
            banner.style.display = 'block';
            setTimeout(() => {
                banner.style.display = 'none';
            }, 5000);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const err = await res.json();
                    showError(err.error || 'Invalid credentials');
                }
            } catch (err) {
                console.error(err);
                showError('Server communication failure');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const phone = document.getElementById('regPhone').value;
            const role = document.getElementById('regRole').value;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, password, phone, role })
                });

                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const err = await res.json();
                    showError(err.error || 'Registration failed');
                }
            } catch (err) {
                console.error(err);
                showError('Server communication failure');
            }
        }
    </script>
</body>
</html>
