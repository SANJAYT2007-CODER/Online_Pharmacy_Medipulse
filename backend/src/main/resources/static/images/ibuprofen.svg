<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="orangeGell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Bottle -->
  <rect x="150" y="70" width="100" height="150" rx="12" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
  <rect x="165" y="45" width="70" height="25" rx="4" fill="#ea580c"/>
  <rect x="160" y="110" width="80" height="70" rx="6" fill="#ffedd5"/>
  <text x="200" y="140" font-family="sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">IBUPROFEN</text>
  <text x="200" y="160" font-family="sans-serif" font-size="11" font-weight="600" fill="#ea580c" text-anchor="middle">400mg Softgels</text>
  <!-- Scattered Softgels -->
  <ellipse cx="120" cy="210" rx="18" ry="10" fill="url(#orangeGell)" transform="rotate(-20 120 210)"/>
  <ellipse cx="280" cy="205" rx="18" ry="10" fill="url(#orangeGell)" transform="rotate(15 280 205)"/>
  <text x="200" y="268" font-family="sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">Ibuprofen Softgels 400mg</text>
</svg>
