<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f0f9ff" rx="16"/>
  <!-- Shadow -->
  <rect x="92" y="42" width="216" height="216" rx="16" fill="#000000" opacity="0.06"/>
  <!-- Box Body -->
  <rect x="90" y="40" width="220" height="220" rx="16" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
  <!-- Top Brand Header -->
  <path d="M 90,56 Q 90,40 106,40 L 294,40 Q 310,40 310,56 L 310,95 L 90,95 Z" fill="#0284c7"/>
  <text x="200" y="70" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">ZOFRAN 4mg</text>
  <text x="200" y="87" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#bae6fd" text-anchor="middle">Ondansetron Orally Disintegrating</text>

  <!-- Rx Badge -->
  <rect x="105" y="105" width="36" height="20" rx="4" fill="#e0f2fe"/>
  <text x="123" y="119" font-family="sans-serif" font-size="11" font-weight="800" fill="#0369a1" text-anchor="middle">Rx</text>

  <!-- Product Illustration: Blister Pack & Tablets -->
  <rect x="135" y="130" width="130" height="85" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <g fill="#0284c7" stroke="#0369a1" stroke-width="1.5">
    <ellipse cx="165" cy="155" rx="16" ry="10"/>
    <ellipse cx="200" cy="155" rx="16" ry="10"/>
    <ellipse cx="235" cy="155" rx="16" ry="10"/>
    <ellipse cx="165" cy="190" rx="16" ry="10"/>
    <ellipse cx="200" cy="190" rx="16" ry="10"/>
    <ellipse cx="235" cy="190" rx="16" ry="10"/>
  </g>

  <!-- Manufacturer & Footer -->
  <line x1="110" y1="230" x2="290" y2="230" stroke="#e2e8f0" stroke-width="1"/>
  <text x="200" y="248" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">GlaxoSmithKline</text>
</svg>
