<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="citrus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Bottle -->
  <rect x="145" y="70" width="110" height="145" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="3"/>
  <rect x="160" y="45" width="80" height="25" rx="6" fill="#f59e0b"/>
  <!-- Sun / Orange Slice graphic -->
  <circle cx="200" cy="130" r="30" fill="url(#citrus)"/>
  <text x="200" y="136" font-family="sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
  <text x="200" y="185" font-family="sans-serif" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">1000mg + ZINC</text>
  <text x="200" y="268" font-family="sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Vitamin C 1000mg + Zinc</text>
</svg>
