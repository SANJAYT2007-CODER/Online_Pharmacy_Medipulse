<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="pillRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="pillWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <circle cx="200" cy="130" r="70" fill="#0284c7" opacity="0.1"/>
  <!-- Cross Symbol -->
  <path d="M190 100 h20 v20 h20 v20 h-20 v20 h-20 v-20 h-20 v-20 h20 z" fill="#0284c7" opacity="0.3"/>
  <!-- Capsule Pill -->
  <g transform="translate(140, 110) rotate(-30)">
    <rect x="0" y="0" width="60" height="40" rx="20" fill="url(#pillRed)"/>
    <rect x="60" y="0" width="60" height="40" rx="20" fill="url(#pillWhite)"/>
  </g>
  <text x="200" y="240" font-family="sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle">MediPulse Pharmacy Product</text>
</svg>
