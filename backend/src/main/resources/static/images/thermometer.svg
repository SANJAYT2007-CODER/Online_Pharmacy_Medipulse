<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="device" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Digital Thermometer Gun -->
  <g transform="translate(140, 50)">
    <!-- Handle -->
    <rect x="50" y="80" width="40" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Head -->
    <rect x="20" y="30" width="100" height="60" rx="15" fill="url(#device)"/>
    <circle cx="25" cy="60" r="10" fill="#38bdf8"/>
    <!-- Screen -->
    <rect x="55" y="42" width="50" height="30" rx="4" fill="#0f172a"/>
    <text x="80" y="62" font-family="monospace" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">98.6°F</text>
  </g>
  <text x="200" y="268" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Digital Infrared Thermometer</text>
</svg>
