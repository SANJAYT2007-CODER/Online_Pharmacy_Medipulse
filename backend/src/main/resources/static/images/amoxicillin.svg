<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="redPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="yellowPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Prescription Box -->
  <rect x="110" y="65" width="180" height="150" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="3"/>
  <rect x="110" y="65" width="180" height="40" rx="10" fill="#dc2626"/>
  <text x="200" y="90" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Rx ANTIBIOTIC</text>
  <!-- Capsule Icon -->
  <g transform="translate(150, 130)">
    <rect x="0" y="0" width="50" height="35" rx="17.5" fill="url(#redPill)"/>
    <rect x="50" y="0" width="50" height="35" rx="17.5" fill="url(#yellowPill)"/>
  </g>
  <text x="200" y="195" font-family="sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">AMOXICILLIN 500mg</text>
  <text x="200" y="268" font-family="sans-serif" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">Amoxicillin Trihydrate 500mg</text>
</svg>
