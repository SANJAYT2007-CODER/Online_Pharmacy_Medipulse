<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MediPulse Online Pharmacy</title>
    <!-- Outfit & Inter Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --success: #10b981;
            --danger: #ef4444;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
            --radius-md: 16px;
            --radius-sm: 8px;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            padding: 2.5rem;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 8px 16px rgba(2, 132, 199, 0.2);
        }

        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .brand-name span { color: var(--primary); }

        .page-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .page-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .notification {
            display: none;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .notification.error { background: var(--danger); color: white; }
        .notification.success { background: var(--success); color: white; }

        .form-group { margin-bottom: 1.25rem; }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .input-wrapper { position: relative; }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-light);
            font-size: 0.95rem;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 20px -6px rgba(2, 132, 199, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-icon"><i class="fa-solid fa-prescription-bottle-medical"></i></div>
            <div class="brand-name">Medi<span>Pulse</span></div>
        </div>

        <h2 class="page-title">Reset Your Password</h2>
        <p class="page-desc">Enter your new secure password below.</p>

        <div id="notifyBanner" class="notification"></div>

        <form id="resetForm" onsubmit="handlePasswordReset(event)">
            <input type="hidden" id="resetToken" th:value="${token}" />

            <div class="form-group">
                <label class="form-label">New Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="newPassword" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter new password" minlength="6" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-key"></i> Update Password
            </button>
        </form>

        <a href="/login" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Sign In</a>
    </div>

    <script>
        function showNotification(msg, type) {
            const banner = document.getElementById('notifyBanner');
            banner.innerText = msg;
            banner.className = 'notification ' + type;
            banner.style.display = 'block';
        }

        async function handlePasswordReset(e) {
            e.preventDefault();
            const token = document.getElementById('resetToken').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!token) {
                showNotification('Missing reset token in URL.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showNotification('Passwords do not match.', 'error');
                return;
            }

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await res.json();
                if (res.ok) {
                    showNotification(data.message || 'Password reset successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showNotification(data.error || 'Password reset failed.', 'error');
                }
            } catch (err) {
                console.error(err);
                showNotification('Server communication error.', 'error');
            }
        }
    </script>
</body>
</html>
