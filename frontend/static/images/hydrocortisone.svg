<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="creamTube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Cream Tube -->
  <g transform="translate(80, 110) rotate(-15)">
    <rect x="0" y="20" width="160" height="50" rx="8" fill="#ffffff" stroke="#e9d5ff" stroke-width="3"/>
    <polygon points="160,20 200,30 200,60 160,70" fill="url(#creamTube)"/>
    <rect x="200" y="32" width="25" height="26" rx="4" fill="#7e22ce"/>
    <text x="70" y="50" font-family="sans-serif" font-size="11" font-weight="800" fill="#7e22ce">HYDROCORTISONE 1%</text>
  </g>
  <text x="200" y="268" font-family="sans-serif" font-size="14" font-weight="700" fill="#6b21a8" text-anchor="middle">Hydrating Hydrocortisone Cream 1%</text>
</svg>
